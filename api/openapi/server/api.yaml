openapi: 3.0.4
info:
  version: 1.0.0
  title: Overlay HTTP API
  description: The overlay server API

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: admin
    description: Admin API endpoints
  - name: non-admin
    description: Non Admin API endpoints
  - name: basm
    description: Public bounded BRC-136 BASM read endpoints

paths:
  /admin/syncAdvertisements:
    post:
      tags:
        - admin
      operationId: AdvertisementsSync
      security:
        - bearerAuth:
            - admin
      responses:
        200:
          $ref: '../paths/admin/responses.yaml#/components/responses/AdvertisementsSyncResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /listLookupServiceProviders:
    get:
      tags:
        - non-admin
      operationId: ListLookupServiceProviders
      security:
        - bearerAuth:
            - user
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/MetadataResponse'

  /listTopicManagers:
    get:
      tags:
        - non-admin
      operationId: ListTopicManagers
      security:
        - bearerAuth:
            - user
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/MetadataResponse'

  /getDocumentationForLookupServiceProvider:
    get:
      tags:
        - non-admin
      operationId: GetLookupServiceProviderDocumentation
      security:
        - bearerAuth:
            - user
      parameters:
        - in: query
          name: lookupService
          schema:
            type: string
          required: true
          description: The name of the lookup service provider to retrieve documentation for
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/LookupServiceProviderDocumentationResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /admin/startGASPSync:
    post:
      tags:
        - admin
      operationId: StartGASPSync
      security:
        - bearerAuth:
            - admin
      responses:
        200:
          $ref: '../paths/admin/responses.yaml#/components/responses/StartGASPSyncResponse'

  /getDocumentationForTopicManager:
    get:
      tags:
        - non-admin
      operationId: GetTopicManagerDocumentation
      security:
        - bearerAuth:
            - user
      parameters:
        - in: query
          name: topicManager
          schema:
            type: string
          required: true
          description: The name of the topic manager to retrieve documentation for
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/TopicManagerDocumentationResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /submit:
    post:
      tags:
        - non-admin
      operationId: SubmitTransaction
      security:
        - bearerAuth:
            - user
      parameters:
        - in: header
          name: x-topics
          schema:
            type: array
            items:
              type: string
          required: true
          explode: true
          style: simple
      requestBody:
        required: true
        $ref: '../paths/non_admin/request-bodies.yaml#/components/requestBodies/SubmitTransactionBody'
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/SubmitTransactionResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'
        409:
          $ref: '#/components/responses/RequestTimeoutResponse'

  /requestSyncResponse:
    post:
      tags:
        - non-admin
      operationId: RequestSyncResponse
      security:
        - bearerAuth:
            - user
      parameters:
        - in: header
          name: X-BSV-Topic
          schema:
            type: string
          required: true
          description: Topic identifier for the sync response request
      requestBody:
        required: true
        $ref: '../paths/non_admin/request-bodies.yaml#/components/requestBodies/RequestSyncResponseBody'
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/RequestSyncResResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /requestForeignGASPNode:
    post:
      tags:
        - non-admin
      operationId: RequestForeignGASPNode
      security:
        - bearerAuth:
            - user
      parameters:
        - in: header
          name: X-BSV-Topic
          schema:
            type: string
          required: true
      requestBody:
        required: true
        $ref: '../paths/non_admin/request-bodies.yaml#/components/requestBodies/RequestForeignGASPNodeBody'
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/RequestForeignGASPNodeResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /lookup:
    post:
      tags:
        - non-admin
      operationId: LookupQuestion
      security:
        - bearerAuth:
            - user
      requestBody:
        required: true
        $ref: '../paths/non_admin/request-bodies.yaml#/components/requestBodies/LookupQuestionBody'
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/LookupQuestionResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /arc-ingest:
    post:
      tags:
        - non-admin
      operationId: ArcIngest
      security:
        - bearerAuth:
            - user
      requestBody:
        required: true
        $ref: '../paths/non_admin/request-bodies.yaml#/components/requestBodies/ArcIngestBody'
      responses:
        200:
          $ref: '../paths/non_admin/responses.yaml#/components/responses/ArcIngestResponse'
        400:
          $ref: '#/components/responses/BadRequestResponse'
        408:
          $ref: '#/components/responses/RequestTimeoutResponse'
        500:
          $ref: '#/components/responses/InternalServerErrorResponse'

  /requestTopicAnchorTip:
    post:
      tags: [basm]
      operationId: RequestTopicAnchorTip
      security: []
      parameters:
        - $ref: '#/components/parameters/BASMTopic'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          $ref: '#/components/responses/BASMTopicAnchorTipResponse'
        400: {$ref: '#/components/responses/BASMErrorResponse'}
        413: {$ref: '#/components/responses/BASMErrorResponse'}
        404: {$ref: '#/components/responses/BASMErrorResponse'}
        501: {$ref: '#/components/responses/BASMErrorResponse'}
        503: {$ref: '#/components/responses/BASMErrorResponse'}
        500: {$ref: '#/components/responses/BASMErrorResponse'}
        504: {$ref: '#/components/responses/BASMErrorResponse'}
        408: {$ref: '#/components/responses/BASMErrorResponse'}

  /requestTopicAnchorRange:
    post:
      tags: [basm]
      operationId: RequestTopicAnchorRange
      security: []
      parameters:
        - $ref: '#/components/parameters/BASMTopic'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BASMTopicAnchorRangeRequest'
      responses:
        200:
          $ref: '#/components/responses/BASMTopicAnchorRangeResponse'
        400: {$ref: '#/components/responses/BASMErrorResponse'}
        413: {$ref: '#/components/responses/BASMErrorResponse'}
        404: {$ref: '#/components/responses/BASMErrorResponse'}
        501: {$ref: '#/components/responses/BASMErrorResponse'}
        503: {$ref: '#/components/responses/BASMErrorResponse'}
        500: {$ref: '#/components/responses/BASMErrorResponse'}
        504: {$ref: '#/components/responses/BASMErrorResponse'}
        408: {$ref: '#/components/responses/BASMErrorResponse'}

  /requestAdmittedList:
    post:
      tags: [basm]
      operationId: RequestAdmittedList
      security: []
      parameters:
        - $ref: '#/components/parameters/BASMTopic'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BASMAdmittedListRequest'
      responses:
        200:
          $ref: '#/components/responses/BASMAdmittedListResponse'
        400: {$ref: '#/components/responses/BASMErrorResponse'}
        413: {$ref: '#/components/responses/BASMErrorResponse'}
        404: {$ref: '#/components/responses/BASMErrorResponse'}
        501: {$ref: '#/components/responses/BASMErrorResponse'}
        503: {$ref: '#/components/responses/BASMErrorResponse'}
        500: {$ref: '#/components/responses/BASMErrorResponse'}
        504: {$ref: '#/components/responses/BASMErrorResponse'}
        408: {$ref: '#/components/responses/BASMErrorResponse'}

  /requestCompoundMerklePath:
    post:
      tags: [basm]
      operationId: RequestCompoundMerklePath
      security: []
      parameters:
        - $ref: '#/components/parameters/BASMTopic'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BASMMerklePathRequest'
      responses:
        200:
          $ref: '#/components/responses/BASMCompoundMerklePathResponse'
        400: {$ref: '#/components/responses/BASMErrorResponse'}
        413: {$ref: '#/components/responses/BASMErrorResponse'}
        404: {$ref: '#/components/responses/BASMErrorResponse'}
        501: {$ref: '#/components/responses/BASMErrorResponse'}
        503: {$ref: '#/components/responses/BASMErrorResponse'}
        500: {$ref: '#/components/responses/BASMErrorResponse'}
        504: {$ref: '#/components/responses/BASMErrorResponse'}
        408: {$ref: '#/components/responses/BASMErrorResponse'}

  /requestRawTransactions:
    post:
      tags: [basm]
      operationId: RequestRawTransactions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BASMRawTransactionsRequest'
      responses:
        200:
          $ref: '#/components/responses/BASMRawTransactionsResponse'
        400: {$ref: '#/components/responses/BASMErrorResponse'}
        413: {$ref: '#/components/responses/BASMErrorResponse'}
        404: {$ref: '#/components/responses/BASMErrorResponse'}
        501: {$ref: '#/components/responses/BASMErrorResponse'}
        503: {$ref: '#/components/responses/BASMErrorResponse'}
        500: {$ref: '#/components/responses/BASMErrorResponse'}
        504: {$ref: '#/components/responses/BASMErrorResponse'}
        408: {$ref: '#/components/responses/BASMErrorResponse'}

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message

    BASMHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
    BASMTopicAnchorRangeRequest:
      type: object
      required: [fromHeight, toHeight]
      properties:
        fromHeight: {type: integer, minimum: 0, maximum: 4294967295}
        toHeight: {type: integer, minimum: 0, maximum: 4294967295}
    BASMAdmittedListRequest:
      type: object
      required: [blockHeight]
      properties:
        blockHeight: {type: integer, minimum: 0, maximum: 4294967295}
        blockHash: {$ref: '#/components/schemas/BASMHash'}
    BASMMerklePathRequest:
      type: object
      required: [blockHeight, txids]
      properties:
        blockHeight: {type: integer, minimum: 0, maximum: 4294967295}
        txids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/BASMHash'}
    BASMRawTransactionsRequest:
      type: object
      required: [txids]
      properties:
        txids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/BASMHash'}
    BASMAnchor:
      type: object
      required: [topic, blockHeight, blockHash, basmRoot, admittedCount, tac]
      properties:
        topic: {type: string, minLength: 1}
        blockHeight: {type: integer, minimum: 0, maximum: 4294967295}
        blockHash: {$ref: '#/components/schemas/BASMHash'}
        basmRoot: {$ref: '#/components/schemas/BASMHash'}
        admittedCount: {type: integer, minimum: 0, maximum: 9007199254740991}
        tac: {$ref: '#/components/schemas/BASMHash'}
    BASMTopicAnchorTip:
      type: object
      required: [topic, blockHeight, tac]
      properties:
        topic: {type: string, minLength: 1}
        blockHeight: {type: integer, minimum: -1, maximum: 4294967295}
        blockHash: {$ref: '#/components/schemas/BASMHash'}
        basmRoot: {$ref: '#/components/schemas/BASMHash'}
        admittedCount: {type: integer, minimum: 0, maximum: 9007199254740991}
        tac: {$ref: '#/components/schemas/BASMHash'}
    BASMTopicAnchorRange:
      type: object
      required: [topic, anchors]
      properties:
        topic: {type: string, minLength: 1}
        anchors:
          type: array
          items: {$ref: '#/components/schemas/BASMAnchor'}
    BASMAdmittedTxRef:
      type: object
      required: [txid, blockIndex]
      properties:
        txid: {$ref: '#/components/schemas/BASMHash'}
        blockIndex: {type: integer, minimum: 0, maximum: 9007199254740991}
    BASMAdmittedList:
      type: object
      required: [topic, blockHeight, admitted]
      properties:
        topic: {type: string, minLength: 1}
        blockHeight: {type: integer, minimum: 0, maximum: 4294967295}
        blockHash: {$ref: '#/components/schemas/BASMHash'}
        admitted:
          type: array
          items: {$ref: '#/components/schemas/BASMAdmittedTxRef'}
    BASMCompoundMerklePath:
      type: object
      required: [topic, blockHeight, txids, merklePath]
      properties:
        topic: {type: string, minLength: 1}
        blockHeight: {type: integer, minimum: 0, maximum: 4294967295}
        txids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/BASMHash'}
        merklePath: {type: string, pattern: '^([0-9a-f]{2})+$'}
    BASMRawTransactionRecord:
      type: object
      required: [txid, rawTx]
      properties:
        txid: {$ref: '#/components/schemas/BASMHash'}
        rawTx: {type: string, pattern: '^([0-9a-f]{2})+$'}
    BASMRawTransactions:
      type: object
      required: [transactions, missing]
      properties:
        transactions:
          type: array
          items: {$ref: '#/components/schemas/BASMRawTransactionRecord'}
        missing:
          type: array
          items: {$ref: '#/components/schemas/BASMHash'}
    BASMError:
      type: object
      required: [status, code, message]
      properties:
        status: {type: string, enum: [error]}
        code: {type: string}
        message: {type: string}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BASMTopicAnchorTipResponse:
      description: Current topic anchor tip.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMTopicAnchorTip'}
    BASMTopicAnchorRangeResponse:
      description: Complete requested topic anchor range.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMTopicAnchorRange'}
    BASMAdmittedListResponse:
      description: Admitted transaction references for a block.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMAdmittedList'}
    BASMCompoundMerklePathResponse:
      description: Compound Merkle path for requested transaction IDs.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMCompoundMerklePath'}
    BASMRawTransactionsResponse:
      description: Raw transactions and missing identifiers.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMRawTransactions'}
    BASMErrorResponse:
      description: >-
        Redacted BASM request failure. Actual route statuses are 400 (invalid
        request), 413 (request too large), 404 (not found), 501 (unsupported),
        503 (not ready), 500 (invalid provider data/internal failure), 504
        (provider timeout), and 408 (request context timeout).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BASMError'}
    BadRequestResponse:
      description: |
        The server cannot process the request due to malformed syntax or invalid input.
        This error is typically caused by client-side issues, such as missing required parameters,
        invalid data formats, or incorrect request structures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundResponse:
      description: |
        The requested resource could not be found. This error occurs when the client
        requests an endpoint or resource that does not exist on the server or cannot be located.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerErrorResponse:
      description: |
        An unexpected condition was encountered on the server, causing the request to fail.
        This error is typically caused by internal issues such as server misconfigurations,
        database failures, or unhandled exceptions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RequestTimeoutResponse:
      description: |
        The server did not receive a complete request within the time it was prepared to wait.
        This error can occur if the client’s request takes too long to process or there is network latency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    BASMTopic:
      in: header
      name: x-bsv-topic
      required: true
      schema:
        type: string
        minLength: 1
      description: Nonempty UTF-8 topic identifier.
